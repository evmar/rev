ip = "0d72:588e"
len = 123
name = "pascal_string_delete"
desc = "Delete a character range from a far Pascal string in place, shifting the remaining suffix left."
details = "Arguments at entry are count ([sp+4]), 1-based position ([sp+6]), string offset/segment ([sp+8]/[sp+0Ah]), and an unused capacity word ([sp+0Ch], callers pass 255); the string's first byte is its length. Checks unsigned 16-bit (position + count - 1) against the original length and calls fatal-error helper 0d72:5ca6 if greater, then stores the low byte of (length - count) and copies new_length - position + 1 bytes forward from string + position + count to string + position; no terminator is copied or cleared. The check does not independently validate position >= 1 or arithmetic overflow, so invalid inputs can pass it; the routine reserves eight local bytes, registers/unregisters its runtime stack frame, preserves SI/DI/BP and DS, has no defined return value, and discards ten argument bytes with RETF 0Ah."
blocks = ["0d72:588e", "0d72:58b4", "0d72:58b9"]

[[params]]
name = "count"
value = "[sp+4]"
type = "u16"
desc = "Number of characters to delete."

[[params]]
name = "position"
value = "[sp+6]"
type = "u16"
desc = "1-based position of the first character to delete."

[[params]]
name = "string_offset"
value = "[sp+8]"
type = "u16"
desc = "Offset of the mutable Pascal string, pointing to its length byte."

[[params]]
