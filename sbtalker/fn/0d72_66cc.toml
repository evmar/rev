ip = "0d72:66cc"
len = 110
name = "write_stdout_far_buffer_chunked"
desc = "Write a far buffer to stdout in chunks of up to 85 bytes via an internal staging buffer."
details = "Iterates over a far byte buffer, copying chunks of at most 55h (85) bytes into the fixed staging buffer at DS:0724h via copy_far_bytes_forward, and writes each chunk to file handle 1 (standard output) via DOS INT 21h AH=40h. If a write call returns an error (AX < 0), or when the remaining length reaches 0 (or exceeds 7FFFh due to underflow/completion), the loop terminates. Returns far, discarding 6 bytes of stack parameters."
