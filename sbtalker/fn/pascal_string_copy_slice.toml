ip = "0935:019f"
name = "pascal_string_copy_slice"
desc = "Copies a 1-based slice of a length-prefixed Pascal string into another Pascal string buffer"
details = "Stores count in destination[0], then copies count bytes from source[index..] into destination[1..]. Source and destination are near pointers addressed through DS and SS respectively; the routine performs no source-length or destination-capacity checks, and copies no payload bytes when signed count is less than 1."
callers = ["tts_pronounce_number@0935:1742", "tts_pronounce_number@0935:1742"]

[[params]]
name = "count"
value = "[bp+4]"
type = "u16"
desc = "Number of characters to copy; its low byte becomes the destination Pascal-string length"

[[params]]
name = "index"
value = "[bp+6]"
type = "u16"
desc = "1-based index of the first source character to copy"

[[params]]
name = "dest"
value = "[bp+8]"
type = "*mut u8"
desc = "Destination Pascal-string buffer in the stack segment"

[[params]]
name = "source"
value = "[bp+0x0a]"
type = "*const u8"
desc = "Source Pascal string in the data segment"

---
0935:019f push bp
0935:01a0 mov bp,sp
0935:01a2 sub sp,4
@mem ; [ss unknown]
0935:01a6 mov di,[bp+8]
; Set the destination Pascal-string length byte to count.
@mem ; [ss unknown]
0935:01a9 mov ax,[bp+4]
@mem ; [ds unknown]
0935:01ac mov [di],al
@mem ; [ss unknown]
0935:01ae mov ax,[bp+4]
@mem ; [ss unknown]
0935:01b1 mov [bp-4],ax
; Skip the character-copy loop when signed count is less than one.
@mem ; [ss unknown]
0935:01b4 cmp word ptr [bp-4],1
@jmp 'copy_done@3
0935:01b8 jl short 01E0h

@mem ; [ss unknown]
0935:01ba mov word ptr [bp-2],1

; Copy source[index + i - 1] to destination[i] for i = 1 through count.
@label copy_character_loop
@mem ; [ss unknown]
0935:01bf mov di,[bp+8]
@mem ; [ss unknown]
0935:01c2 add di,[bp-2]
@mem ; [ss unknown]
0935:01c5 mov si,[bp+6]
@mem ; [ss unknown]
0935:01c8 add si,[bp-2]
@mem ; [ss unknown]
0935:01cb add si,[bp+0Ah]
@mem ; [ds unknown]
0935:01ce mov al,[si-1]
@mem ; [ds unknown]
0935:01d1 mov [di],al
@mem ; [ss unknown]
0935:01d3 mov ax,[bp-2]
0935:01d6 inc ax
@mem ; [ss unknown]
0935:01d7 mov [bp-2],ax
0935:01da dec ax
@mem ; [ss unknown]
0935:01db cmp ax,[bp-4]
@jmp 'copy_character_loop@2
0935:01de jne short 01BFh

@label copy_done
0935:01e0 mov sp,bp
0935:01e2 pop bp
0935:01e3 ret 8

