function 0d72:5c2a (checked_stack_frame_prologue)

Establish a BP frame and reserve AX local bytes, checking for stack
underflow and the runtime stack limit.

Called with a near CALL: removes the continuation IP into CX, saves the
old BP, sets BP to that saved word, and computes BX = BP - AX; if
subtraction does not borrow and BX >= unsigned DS:[0792h], sets SP = BX
and jumps to CX, leaving AX unchanged and BX/CX clobbered. On failure,
constructs a far continuation and transfers to 0d72:6b88, which repeats
the allocation check and either returns to that continuation, dispatches
through the far handler at DS:[078Eh] (offset FFFFh means absent), or
enters the default diagnostic/termination path with error code 0. On
normal continuation [BP] holds the old BP and locals occupy [BP-AX,BP);
the caller restores SP/BP in its own epilogue, and the apparent
fallthrough beyond the indirect termination call at 6d39 is not part of
the intended prologue flow (a separate function begins at 6d3e).

parameters:
  ax  local_bytes: u16 Number of local stack bytes to reserve below the saved BP; no alignment adjustment is performed.

