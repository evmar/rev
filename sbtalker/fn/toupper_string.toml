name = "toupper_string"
desc = "Converts an ASCII string of length CX pointed to by DI to uppercase in-place."
details = "Iterates through CX bytes of an ASCII string buffer pointed to by DI. For each byte, checks if it falls within the lowercase ASCII range ('a'-'z', 0x61 to 0x7A) and masks it with 0x5F to convert to uppercase. Preserves both DI and CX registers on return."
ip = "0823:0b54"

[[params]]
name = "str"
value = "di"
type = "*mut u8"
desc = "Pointer to the input ASCII string to convert"

[[params]]
name = "len"
value = "cx"
type = "u16"
desc = "Length of the string in bytes"

---
; Save registers
0823:0b54 push di
0823:0b55 push cx

; Check if character is lowercase ASCII ('a'-'z')
0823:0b56 mov al,[di]
0823:0b58 cmp al,61h
@jmp '4
0823:0b5a jb short 0B62h

0823:0b5c cmp al,7Ah
@jmp '4
0823:0b5e ja short 0B62h

; Convert lowercase character to uppercase by clearing bit 5
0823:0b60 and al,5Fh

; Store modified byte, advance pointer, and loop until CX reaches 0
0823:0b62 mov [di],al
0823:0b64 inc di
@jmp '1
0823:0b65 loop 0B56h

; Restore registers and return
@label 'return
0823:0b67 pop cx
0823:0b68 pop di
0823:0b69 ret

