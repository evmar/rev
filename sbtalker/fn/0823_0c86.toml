name = "load_driver"
desc = "Parses an optional driver name, formats a driver filename with a .DRV extension, and attempts to load it, exiting on failure."
details = "Checks an internal buffer at cs:01AAh for an optional driver filename. If specified, it copies up to eight characters into the path buffer at cs:01B5h, appends the '.DRV' extension, and null-pads the remainder of the filename. It then calls an internal loader routine at 0823:0C12h; if the routine fails (indicated by CF=1), it outputs an error message and terminates the process via DOS interrupt 21h, function 4Ch."
