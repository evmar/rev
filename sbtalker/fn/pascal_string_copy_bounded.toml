ip = "0d72:538c"
name = "pascal_string_copy_bounded"
desc = "Copies a length-prefixed Pascal string to a destination buffer, truncating to its capacity minus the length byte."
details = "Reads the source length byte at AX:SI, computes n = min(source_length, (CX - 1) modulo 65536), stores n at ES:DI, and copies n payload bytes without adding a NUL terminator. CX is the total destination capacity including the length byte (normally 1..256); zero is not checked and underflows to 65535, causing the entire source string to be copied. Preserves DS, ES and BP; leaves AX equal to the original source length, CX zero, SI and DI advanced by n+1, and DF clear, using a forward word copy followed by an optional odd byte (not safe for arbitrary overlap)."
callers = ["bst_find_value@0935:0080", "path_append_component@0935:109f", "parse_and_emit_token@0935:12fc", "tts_pronounce_number@0935:1742", "tts_pronounce_number@0935:1742", "pronounce_two_digit_number@0935:1e4e", "parse_date_or_time@0935:21f1", "dispatch_action_by_state@0935:30a1", "process_transaction_loop@0935:3d66"]

[[params]]
name = "source_segment"
value = "ax"
type = "u16"
desc = "Segment of the source Pascal string; temporarily loaded into DS."

[[params]]
name = "source_offset"
value = "si"
type = "u16"
desc = "Offset of the source length byte within source_segment."

[[params]]
name = "destination_segment"
value = "es"
type = "u16"
desc = "Segment of the destination Pascal string buffer."

[[params]]
name = "destination_offset"
value = "di"
type = "u16"
desc = "Offset at which to write the destination length byte and payload."

[[params]]
name = "destination_capacity"
value = "cx"
type = "u16"
desc = "Total destination buffer size including its length byte; 256 permits all 255 payload bytes, 1 produces an empty string, and 0 is invalid but unchecked."

---
0d72:538c push bp
0d72:538d mov bp,sp
; Save caller DS and select the source segment supplied in AX.
0d72:538f push ds
0d72:5390 mov ds,ax
; Load and zero-extend the source Pascal string length into AX.
@mem ; [ds unknown]
0d72:5392 mov al,[si]
0d72:5394 xor ah,ah
; Reserve one destination byte for the length prefix; unsigned clamp CX to min(capacity - 1, source length). Capacity zero wraps.
0d72:5396 dec cx
0d72:5397 cmp ax,cx
@jmp 'store_length_and_copy@2
0d72:5399 jae short 539Dh

0d72:539b mov cx,ax

; Write the truncated length byte and advance both pointers to the payload.
@label store_length_and_copy
@mem ; [es unknown]
0d72:539d mov es:[di],cl
0d72:53a0 inc si
0d72:53a1 inc di
; Copy floor(n/2) words forward; SHR retains n's low bit in CF across CLD and REP MOVSW.
0d72:53a2 shr cx,1
0d72:53a4 cld
0d72:53a5 rep movsw
; CX is now zero; ADC CX,CX converts the saved carry into a 0/1 byte count for the odd trailing byte.
0d72:53a7 adc cx,cx
0d72:53a9 rep movsb
; Restore caller DS and frame, then far return; no stack arguments to discard.
0d72:53ab pop ds
0d72:53ac mov sp,bp
0d72:53ae pop bp
0d72:53af retf

