ip = "0d72:013c"
name = "dispatch_pronunciation_context_operator"
desc = "Dispatches a pronunciation-rule context metacharacter to its specialized matcher."
details = "Uses the decoded context operator in the caller's shared frame to select a near handler from a code-segment jump table. It supplies the current input byte and the adjacent byte in the active scan direction; the selected handler updates the shared match flag, input cursor, and optional context backtracking marker before returning directly to apply_pronunciation_rules."
callers = ["apply_pronunciation_rules@0d72:0010"]
callees = ["unknown:reg"]

[[params]]
name = "input_cursor"
value = "si"
type = "*mut u8"
desc = "Near pointer to the current input byte; specialized handlers may advance or retreat it."

[[params]]
name = "rule_cursor"
value = "di"
type = "*const u8"
desc = "Near code-segment pointer to the current encoded rule context token."

[[params]]
name = "context_operator"
value = "[bp+1]"
type = "u8"
desc = "Decoded context metacharacter used to index the handler jump table."

[[params]]
name = "scan_stride"
value = "[bp+0Ch]"
type = "i16"
desc = "Signed input scan direction, normally -1 for left context or +1 for right context."

---
; Clear the shared context-match/consumed-count result before testing the operator.
@mem ; [ss unknown]
0d72:013c mov byte ptr [bp+3],0
; Load the current input byte into CL and the byte one scan step away into CH.
@mem ; [ds unknown]
0d72:0140 mov cl,[si]
@mem ; [ss unknown]
0d72:0142 mov bx,[bp+0Ch]
@mem ; [ds unknown]
0d72:0145 mov ch,[bx+si]
; Index the context-operator handler table with the decoded metacharacter.
@mem ; [ss unknown]
0d72:0147 mov al,[bp+1]
0d72:014a shl al,1
0d72:014c mov bl,al
0d72:014e xor bh,bh
@mem ; [bx unknown]
0d72:0150 mov ax,cs:[bx+2EAh]
; Pass the current input byte in BL and tail-jump to the specialized matcher; it returns directly to the caller.
0d72:0155 mov bl,cl
@jmp unknown:reg
0d72:0157 jmp ax

