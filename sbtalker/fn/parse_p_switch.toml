name = "parse_p_switch"
desc = "Searches an input string (such as command line arguments) for the switch '/P' followed by a 4-digit hexadecimal value. It converts the 4 hex digits into a 16-bit word and stores the result into CS:[01B2h]. If the switch is not found or conversion fails, zero is stored."
xrefs = ["0823:0b6a"]
ip = "0823:0bb2"

---
; Save registers, clear direction flag, and initialize result BX to 0.
0823:0bb2 push di
0823:0bb3 push cx
0823:0bb4 xor bx,bx
0823:0bb6 cld

; Scan string for '/' followed by 'P'; exit if end of string is reached.
0823:0bb7 mov al,2Fh
0823:0bb9 repne scasb
@jmp '7
0823:0bbb jcxz 0BDFh

0823:0bbd cmp byte ptr [di],50h
@jmp '1
0823:0bc0 jne short 0BB7h

; Skip 'P' and set up counter to parse 4 hexadecimal digits.
0823:0bc2 inc di
0823:0bc3 xor bx,bx
0823:0bc5 mov dx,4
0823:0bc8 mov cx,4

; Read each character, convert it to a numeric nibble, and accumulate it into BX.
0823:0bcb mov al,[di]
0823:0bcd inc di
@jmp 0823:0b6a
0823:0bce call 0B6Ah
0823:0bd1 cmp ah,0
@jmp '7
0823:0bd4 jne short 0BDFh

0823:0bd6 shl bx,cl
0823:0bd8 add bx,ax
0823:0bda dec dx
@jmp '4
0823:0bdb jne short 0BCBh

@jmp '7
0823:0bdd jmp short 0BDFh

; Save the parsed 16-bit value at CS:[01B2h], restore registers, and return.
0823:0bdf mov cs:[1B2h],bx
0823:0be4 pop cx
0823:0be5 pop di
0823:0be6 ret

