ip = "0935:0b91"
len = 187
name = "is_not_sentence_end"
desc = "Tests whether a period at a given string index does NOT terminate a sentence"
details = "Inspects a Pascal-style string at a specified 1-based index. If the character is not a period ('.') or is out of bounds, the function returns 1. If it is a period, it checks whether it marks a sentence boundary: either followed immediately by a terminator/control character (from a set at ds:1CB4h), or followed by optional closing punctuation (from a set at ds:1CC4h) and then a space plus a non-space character. If either sentence-ending condition is met, it returns 0; otherwise it returns 1."
blocks = ["0935:0b91", "0935:0ba9", "0935:0bac", "0935:0bb5", "0935:0bb8", "0935:0bd1", "0935:0bd7", "0935:0be4", "0935:0c02", "0935:0c07", "0935:0c17", "0935:0c23", "0935:0c2c", "0935:0c39", "0935:0c3d"]

