function 0d72:5004 (unregister_outermost_stack_frame)

Clears the registered runtime stack-frame marker when the owning frame
exits.

Pairs with register_outermost_stack_frame at 0d72:4fcc: computes
boundary = ((entry BP & 0xFFFE) + 2) modulo 65536 and clears DS:0602h if
boundary >= the saved marker using an unsigned comparison. A deeper
nested caller whose boundary is below the marker leaves it unchanged; an
already-zero marker remains zero, and saved context words
DS:0604h..0608h are not modified. Takes no stack arguments and returns
with RETF, preserving BP and clobbering AX, BX and arithmetic flags; AX
contains the computed boundary but is not an established return value.

parameters:
  bp  caller_frame_pointer: u16 Implicit caller stack-frame offset in SS; bit 0 is masked off before comparing the caller's frame boundary with the registered marker.

parameters:
  ds  data_segment: u16 Runtime data segment containing the registered stack marker at offset 0602h.

---
0d72:5004 push bp
0d72:5005 mov bp,sp
; Read entry BP from the saved word at SS:[BP], obtaining the caller's frame pointer.
@mem ; [ss unknown]
0d72:5007 mov bx,[bp]
; Clear the caller BP low bit and compute its frame boundary: AX = (caller_BP & FFFEh) + 2 (16-bit).
0d72:500a and bx,0FFFEh
@mem ; [ds unknown]
0d72:500d lea ax,[bx+2]
; Unsigned comparison with DS:0602h: preserve the outer registration if this caller's boundary is below its marker (nested frame).
@mem ; [ds unknown]
0d72:5010 cmp ax,ds:[602h]
@jmp 'return_after_frame_check@2
0d72:5014 jb short 501Ch

; Caller boundary has reached or passed the registered marker: invalidate it. Saved diagnostic words at 0604h..0608h remain intact.
@mem ; [ds unknown]
0d72:5016 mov word ptr ds:[602h],0

; Restore BP and return far without removing arguments; AX/BX are scratch values.
@label return_after_frame_check
0d72:501c mov sp,bp
0d72:501e pop bp
0d72:501f retf

