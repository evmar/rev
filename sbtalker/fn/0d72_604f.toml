value = "[bp+6]"
type = "*mut u8"
desc = "Near pointer to the 32-byte destination set in DS."

[[params]]
name = "or_set"
value = "[bp+8]"
type = "*const u8"
desc = "Far pointer to the set whose bytes are ORed into the destination."

[[params]]
name = "or_last_index"
value = "[bp+0Ch]"
type = "u16"
desc = "Inclusive last byte index to read from or_set."

[[params]]
name = "base_set"
value = "[bp+0Eh]"
type = "*const u8"
desc = "Far pointer to the set copied into the destination first."

[[params]]
