name = "parse_cmdline"
desc = "Parses and processes command-line arguments from the DOS Program Segment Prefix (PSP)."
details = "Saves registers and sets both DS and ES to the PSP segment stored at cs:[8Eh]. Checks the command-line tail length byte at PSP offset 80h; if arguments are present, it advances DI to offset 81h and invokes toupper_string, parse_cmdline_p_switch, and parse_cmdline_d_switch before restoring the saved registers and returning."
xrefs = ["parse_cmdline_d_switch", "parse_cmdline_p_switch", "toupper_string"]
ip = "0823:0be7"

---
; Save caller registers
0823:0be7 push dx
0823:0be8 push cx
0823:0be9 push bx
0823:0bea push ax
0823:0beb push ds
0823:0bec push es
; Load PSP segment into DS and ES
0823:0bed mov ax,cs:[8Eh]
0823:0bf1 mov ds,ax
0823:0bf3 mov es,ax
; Check command-line argument length at PSP:0080h; skip if empty
0823:0bf5 mov di,80h
0823:0bf8 sub cx,cx
0823:0bfa mov cl,[di]
0823:0bfc cmp cl,0
@jmp '2
0823:0bff je short 0C0Bh

; Point DI to command string (PSP:0081h) and process switches
0823:0c01 inc di
@jmp toupper_string
0823:0c02 call 0B54h
@jmp parse_cmdline_p_switch
0823:0c05 call 0BB2h
@jmp parse_cmdline_d_switch
0823:0c08 call 0B87h

; Restore registers and return
0823:0c0b pop es
0823:0c0c pop ds
0823:0c0d pop ax
0823:0c0e pop bx
0823:0c0f pop cx
0823:0c10 pop dx
0823:0c11 ret

