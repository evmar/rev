function 0d72:0222 (test_attr_and_advance)

Tests a flag in a lookup table for an indexed item and conditionally
increments a counter and updates SI

Checks bit 3 (0x08) of the byte at cs:[bx+4A9Ch]. If the bit is set, it
increments a byte counter at [bp+3] and adds the word at [bp+0Ch] to
register si.

parameters:
  bx  index: u16 Index into the attribute table at cs:4A9Ch

parameters:
  bp  ctx: *mut u8 Pointer to context structure or caller stack frame

parameters:
  si  accum: u16 Accumulator or coordinate offset to be updated if flag is set

---
; Fetch attribute byte from lookup table
@mem ; [bx unknown]
0d72:0222 mov al,cs:[bx+4A9Ch]
; Check if bit 3 (mask 0x08) is set
0d72:0227 and al,8
@jmp 'done@2
0d72:0229 je short 0231h

; Increment counter in context structure
@mem ; [ss unknown]
0d72:022b inc byte ptr [bp+3]
; Advance SI by step/delta stored at [bp+0Ch]
@mem ; [ss unknown]
0d72:022e add si,[bp+0Ch]

@label done
0d72:0231 ret

