ip = "0d72:0180"
name = "save_context_backtracking_marker"
desc = "Saves the current pronunciation-rule cursor as the context matcher's backtracking marker."
details = "This is a shared tail fragment within the pronunciation context-operator dispatcher, not an independently framed procedure. It copies DI into the parent apply_pronunciation_rules frame's marker slot at [BP+0Eh], allowing the caller to retry or rewind the current encoded context token, then returns."

[[params]]
name = "rule_cursor"
value = "di"
type = "*const u8"
desc = "Near code-segment pointer to the current encoded pronunciation-rule token."

[[params]]
name = "backtracking_marker"
value = "[bp+0Eh]"
type = "u16"
desc = "Caller-frame slot that receives rule_cursor for context-match backtracking."

---
; Save the current encoded-rule cursor in the parent matcher's context backtracking slot.
0d72:0180 mov [bp+0Eh],di
; Return to the pronunciation-rule context matching loop.
0d72:0183 ret

