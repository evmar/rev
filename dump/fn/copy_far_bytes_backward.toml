function 0d72:50a4 (copy_far_bytes_backward)

Copy a byte count from a far source pointer to a far destination
pointer, proceeding backward.

Loads DS:SI from the source and ES:DI from the destination, adds count-1
to both offsets, then sets DF and uses REP MOVSB to copy from last byte
to first; count zero performs no memory transfer, and offsets wrap at 16
bits without segment adjustment. The caller pushes source
segment/offset, destination segment/offset, then count; RETF 0Ah
discards these five words, with no defined return value, preserving
DS/BP, clobbering AX/CX/SI/DI/ES, and leaving DF clear (CX is zero and
SI/DI finish at their original offsets minus one). This supports
backward-safe overlapping copies, as used by 0d72:5909 to shift a
length-prefixed string's suffix toward higher addresses before
insertion; it does not choose the copy direction or validate bounds.

parameters:
  [sp+4]  count: u16 Number of bytes to copy; zero performs no memory transfer.

parameters:
  [sp+6]  destination_offset: u16 Destination starting offset, loaded into DI.

parameters:
  [sp+8]  destination_segment: u16 Destination segment, loaded into ES.

parameters:
  [sp+0Ah]  source_offset: u16 Source starting offset, loaded into SI.

parameters:
  [sp+0Ch]  source_segment: u16 Source segment, temporarily loaded into DS.

---
0d72:50a4 push bp
0d72:50a5 mov bp,sp
0d72:50a7 push ds
; Load source far pointer from BP+0Eh:BP+0Ch into DS:SI; original DS is saved.
@mem ; [ss unknown]
0d72:50a8 mov ax,[bp+0Eh]
0d72:50ab mov ds,ax
@mem ; [ss unknown]
0d72:50ad mov si,[bp+0Ch]
; Load destination far pointer from BP+0Ah:BP+8 into ES:DI.
@mem ; [ss unknown]
0d72:50b0 mov ax,[bp+0Ah]
0d72:50b3 mov es,ax
@mem ; [ss unknown]
0d72:50b5 mov di,[bp+8]
; CX = unsigned byte count.
@mem ; [ss unknown]
0d72:50b8 mov cx,[bp+6]
; Position SI and DI at source+count-1 and destination+count-1 (16-bit offset arithmetic).
0d72:50bb add si,cx
0d72:50bd dec si
0d72:50be add di,cx
0d72:50c0 dec di
; Set DF for backward copying; REP MOVSB copies CX bytes, decrementing SI/DI. CX=0 skips all transfers.
0d72:50c1 std
0d72:50c2 rep movsb
; Leave DF clear, then restore caller DS and BP.
0d72:50c4 cld
0d72:50c5 pop ds
0d72:50c6 mov sp,bp
0d72:50c8 pop bp
; Far return, discarding 10 bytes of arguments; no defined return value.
0d72:50c9 retf 0Ah

