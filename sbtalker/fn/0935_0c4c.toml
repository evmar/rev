ip = "0935:0c4c"
len = 307
name = "edit_adjust_digit"
desc = "Adjusts a single-digit numeric field (0-9) in an input buffer, updating the display string and cursor."
details = "Calculates a new digit value by adding the delta parameter to a base offset, clamping the result to the range [0, 9]. If the value changed, it formats the digit to ASCII ('0'-'9'), optionally removes an existing digit from the buffer, inserts the new character via a string manipulation routine, and updates cursor/length offsets in the context structure."
