function 0d72:4b0c (write_stdout_near_buffer)

Write a counted byte buffer in DS to standard output through the far-
buffer output helper.

Near-call wrapper: forwards the length at [bp+8] and the far pointer
DS:[bp+6] to 0d72:66cc, which stages up to 85 bytes at a time and
invokes DOS AH=40h with handle 1 (standard output). The word at [bp+4]
is an unused hidden parent-frame/static-link argument, as shown by
callers pushing BP or forwarding their own link; RET 6 discards all
three argument words. No terminator scan or newline is added, and
callers do not consume a return value (AX is left as produced by the
helper).

parameters:
  [sp+2]  parent_frame: u16 Unused hidden static link / parent BP; [bp+4] after the prologue.

parameters:
  [sp+4]  buffer_offset: u16 Offset of counted byte buffer within DS; [bp+6] after the prologue.

parameters:
  [sp+6]  length: u16 Byte count passed unchanged to the output helper; [bp+8] after the prologue.

parameters:
  ds  buffer_segment: u16 Data segment used to turn the near buffer offset into a far pointer.

---
0d72:4b0c push bp
0d72:4b0d mov bp,sp
0d72:4b0f sub sp,0
; Push byte count, then DS and buffer offset to form the far helper's (buffer, count) arguments; hidden parent link at [bp+4] is unused.
@mem ; [ss unknown]
0d72:4b13 push word ptr [bp+8]
0d72:4b16 push ds
@mem ; [ss unknown]
0d72:4b17 push word ptr [bp+6]
; Write the counted DS buffer to stdout via the helper's 85-byte staging buffer.
@jmp 0d72:66cc
0d72:4b1a call far ptr 0D72h:66CCh
0d72:4b1f mov sp,bp
0d72:4b21 pop bp
; Near return, removing hidden parent link, buffer offset, and byte count (6 bytes).
0d72:4b22 ret 6

