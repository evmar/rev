name = "apply_pronunciation_rules"
desc = "Converts a Pascal-style input word to a Pascal-style phoneme string using table-driven pronunciation rules."
details = "Temporarily replaces the input length byte and byte after the word with spaces, then scans the word from left to right. For each character it searches a character-indexed rule table, tests the rule's left and right contexts (including metacharacters dispatched by the helper at 0d72:013c), appends the matched rule's encoded phoneme bytes to the output, restores the input length byte, and stores the output length."
callers = ["parse_and_emit_token@0935:12fc"]
callees = ["dispatch_pronunciation_context_operator@0d72:013c"]

[[params]]
name = "output"
value = "[sp+4]"
type = "*mut u8"
desc = "Far pointer to the destination Pascal string; byte 0 receives the phoneme-string length and bytes 1.. contain encoded phonemes."

[[params]]
name = "input"
value = "[sp+8]"
type = "*mut u8"
desc = "Far pointer to a mutable Pascal input string; its length byte is saved/restored, and the byte immediately after its characters is temporarily overwritten with a space sentinel."

