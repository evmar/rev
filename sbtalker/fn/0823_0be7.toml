name = "parse_cmdline"
desc = "Parses and processes command-line arguments from the DOS Program Segment Prefix (PSP)."
details = "Saves registers and sets both DS and ES to the PSP segment stored at cs:[8Eh]. Checks the command-line tail length byte at PSP offset 80h; if arguments are present, it advances DI to offset 81h and invokes toupper_string, parse_cmdline_p_switch, and parse_cmdline_d_switch before restoring the saved registers and returning."
