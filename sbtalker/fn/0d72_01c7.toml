value = "ch"
type = "u8"
desc = "Byte one scan step from the current input position."

[[params]]
name = "char_table_index"
value = "bx"
type = "u16"
desc = "Zero-extended current byte, used to index the character-property table."

[[params]]
name = "input_cursor"
value = "si"
type = "*mut u8"
desc = "Current near input pointer; decremented by one or two bytes on a match."

[[params]]
