ip = "0d72:01b0"
name = "misaligned_class01_table_displacement_entry"
desc = "Spurious function entry in the displacement operand of a class-0x01 character-property lookup."
details = "Address 0d72:01b0 is not a valid semantic entry point: byte 0x4A is the high byte of the displacement in `mov al,cs:[bx+4A9Ch]` beginning at 0d72:01ac, and decoding it independently produces the bogus `dec dx`. Normal control executes the lookup at 01ac, tests property bit 0x01 at 01b1, and, on a match, advances SI before testing the adjacent byte and optionally saving DI as the repetition/backtracking marker."

---
; Misaligned decode: this byte belongs to the displacement of the property-table lookup at 01AC; no real control flow enters here.
0d72:01b0 dec dx
; Valid enclosing matcher path: test whether the current input byte has character-property bit 0x01.
0d72:01b1 and al,1
@jmp 'return@3
0d72:01b3 je short 01C6h

; Advance the input cursor by the caller's signed scan stride.
0d72:01b5 add si,[bp+0Ch]
; Look up the adjacent input byte (held in CH) in the character-property table.
0d72:01b8 mov bl,ch
0d72:01ba mov al,cs:[bx+4A9Ch]
; Test whether the adjacent byte also has property bit 0x01.
0d72:01bf and al,1
@jmp 'return@3
0d72:01c1 je short 01C6h

; Save DI as the repetition/backtracking marker when another class member follows.
0d72:01c3 mov [bp+0Eh],di

; Return to the pronunciation-rule context matcher.
@label return
0d72:01c6 ret

