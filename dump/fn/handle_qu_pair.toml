function 0d72:0213 (handle_qu_pair)

Recognize an uppercase QU pair and update the caller's scan state.

Returns without changing scan state unless CH is 'Q' (0x51) and CL is
'U' (0x55). On a match, adds the word at SS:[BP+0x0C] to SI twice (with
16-bit wraparound), increments the byte at SS:[BP+3], and tests bit 0 of
CS:[0x4A9C+BX] after replacing BL with CH; if set, stores DI to
SS:[BP+0x0E]. BH is preserved, so interpreting the lookup as a simple
character-indexed table requires the caller to supply BH=0; the precise
meanings of the counter and saved DI are not established by this routine
alone.

parameters:
  cx  character_pair: u16 CH must contain uppercase Q and CL uppercase U for the state update to occur.

parameters:
  si  scan_position: u16 Scan position, advanced in place by twice the word stride at SS:[BP+0x0C] when QU matches.

parameters:
  bp  scan_state: u16 Offset in SS of caller-owned state: byte counter at +3, word stride at +0x0C, and saved word position at +0x0E.

parameters:
  di  position_to_save: u16 Stored at SS:[BP+0x0E] on a QU match if the character-table entry has bit 0 set.

parameters:
  bh  table_index_high: u8 Preserved high byte of the character-table index; BL becomes Q on a match. Expected to be zero for a simple 256-entry character table.

---
; Increment the caller's byte counter at SS:[BP+3] (wraps modulo 256).
@label update_scan_state
@mem ; [ss unknown]
0d72:01f8 inc byte ptr [bp+3]
; Advance SI by the word stride at SS:[BP+0x0C]; total advance on this entry path is twice the stride.
@mem ; [ss unknown]
0d72:01fb add si,[bp+0Ch]
; Use CH as the low byte of the character-table index; BH is not cleared here.
0d72:01fe mov bl,ch
; Load character flags from CS:[0x4A9C+BX] (CS:[0x4AED] for Q if BH=0).
@mem ; [bx unknown]
0d72:0200 mov al,cs:[bx+4A9Ch]
; Only bit 0 controls whether DI is saved; AL is left holding this bit.
0d72:0205 and al,1
@jmp 'return_to_caller@2
0d72:0207 je short 020Ch

; Save DI in the caller's state when the character-table flag is set.
@mem ; [ss unknown]
0d72:0209 mov [bp+0Eh],di

@label return_to_caller
0d72:020c ret

; Require CH == 'Q'; otherwise return without updating scan state.
0d72:0213 cmp ch,51h
@jmp 'return_to_caller@2
0d72:0216 jne short 020Ch

; Require CL == 'U' to recognize the QU pair.
0d72:0218 cmp cl,55h
@jmp 'return_to_caller@2
0d72:021b jne short 020Ch

; First stride advance for QU; the shared update block advances SI once more.
@mem ; [ss unknown]
0d72:021d add si,[bp+0Ch]
@jmp 'update_scan_state@0
0d72:0220 jmp short 01F8h

