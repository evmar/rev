function 0d72:01c7 (match_class_04_context_with_h_digraph)

Matches character-property class 0x04, treating CH, SH, and TH as two-
byte units.

Tests the current input byte via the character-property table at
CS:4A9C. When the current byte is H and the adjacent byte in the scan
direction is C, S, or T, it consumes two bytes; otherwise a class-bit
0x04 match consumes one byte. Each successful match increments the
shared context-match count.

parameters:
  cl  current_char: u8 Current input byte being tested.

parameters:
  ch  adjacent_char: u8 Byte one scan step from the current input position.

parameters:
  bx  char_table_index: u16 Zero-extended current byte, used to index the character-property table.

parameters:
  si  input_cursor: *mut u8 Current near input pointer; decremented by one or two bytes on a match.

parameters:
  [bp+3]  match_count: u8 Shared caller-frame context-match count, incremented on success.

---
; Special-case H preceded in the active scan direction by C, S, or T.
0d72:01c7 cmp cl,48h
@jmp 'test_class_bit@5
0d72:01ca jne short 01E1h

0d72:01cc mov al,ch
0d72:01ce cmp al,43h
@jmp 'match_h_digraph@4
0d72:01d0 je short 01DAh

0d72:01d2 cmp al,53h
@jmp 'match_h_digraph@4
0d72:01d4 je short 01DAh

0d72:01d6 cmp al,54h
@jmp 'return_to_context_matcher@7
0d72:01d8 jne short 01EEh

; Consume the two-byte CH/SH/TH unit and record one successful context match.
@label match_h_digraph
0d72:01da sub si,2
@mem ; [ss unknown]
0d72:01dd inc byte ptr [bp+3]
0d72:01e0 ret

; Otherwise test character-property bit 0x04 for the current byte.
@label test_class_bit
@mem ; [bx unknown]
0d72:01e1 mov al,cs:[bx+4A9Ch]
0d72:01e6 and al,4
@jmp 'return_to_context_matcher@7
0d72:01e8 je short 01EEh

; Consume one matching byte and record the successful context match.
0d72:01ea dec si
@mem ; [ss unknown]
0d72:01eb inc byte ptr [bp+3]

@label return_to_context_matcher
0d72:01ee ret

