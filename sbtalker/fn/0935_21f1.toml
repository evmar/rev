name = "parse_date_or_time"
desc = "Parses a formatted date (MM/DD/YY) or time (HH:MM[:SS]) string."
details = "Attempts to parse a date or time from the input scanner stream. If the delimiter following the first integer is '/' or '-', it parses day and year values (normalizing years >= 1900) and checks their ranges. If the delimiter is ':', it parses minutes and optional seconds. On failure, it rolls back the stream state and returns 0."
