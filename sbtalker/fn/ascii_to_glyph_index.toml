name = "ascii_to_glyph_index"
desc = "Converts an ASCII character to a zero-based font/glyph index by subtracting 32"
details = "Takes a character value, subtracts 0x20 (' ', ASCII 32) so printable characters start at index 0, masks the result to an 8-bit unsigned value, and returns it."
callers = ["get_next_char@0935:11a0", "parse_and_emit_token@0935:12fc"]
ip = "0935:0063"

[[params]]
name = "c"
value = "[bp+4]"
type = "u8"
desc = "ASCII character code"

[ret]
name = "glyph_idx"
value = "ax"
type = "u16"
desc = "Zero-based glyph/character index (c - 32)"

---
0935:0063 push bp
0935:0064 mov bp,sp
0935:0066 sub sp,2
; Load input character
@mem ; [ss unknown]
0935:006a mov al,[bp+4]
0935:006d xor ah,ah
; Subtract 32 (ASCII space offset)
0935:006f add ax,0FFE0h
; Clear high byte (zero-extend 8-bit result)
0935:0072 xor ah,ah
@mem ; [ss unknown]
0935:0074 mov [bp-2],al
@mem ; [ss unknown]
0935:0077 mov ax,[bp-2]
0935:007a mov sp,bp
0935:007c pop bp
0935:007d ret 2

