ip = "0d72:582a"
name = "pascal_string_append_bytes"
desc = "Append a counted byte sequence to a length-prefixed Pascal string, checking destination capacity."
details = "Reads the destination length byte, adds count using 16-bit arithmetic, and uses a signed comparison against capacity; if the sum is greater, calls the fatal-error helper at 0d72:5ca6 (error code 0x27). Otherwise copies count bytes forward from the far source pointer to destination + 1 + old_length, then rereads and increases the destination length byte without adding a NUL terminator; intended inputs are valid Pascal string lengths/capacities (0..255), and arbitrary overlapping buffers are not supported by the forward copy. The caller at 0935:24be passes capacity 255 and a token payload excluding its length byte; the routine allocates four local bytes through 0d72:5c2a, registers/unregisters its runtime stack frame, preserves SI/DI/BP/DS, and returns with RETF 0Ch and no defined return value."
callers = ["parse_argument_switches@0935:23ed"]
callees = ["checked_stack_frame_prologue@0d72:5c2a", "copy_far_bytes_forward@0d72:507e", "register_outermost_stack_frame@0d72:4fcc", "report_pascal_string_bounds_error@0d72:5ca6", "unregister_outermost_stack_frame@0d72:5004"]

[[params]]
name = "source_offset"
value = "[sp+4]"
type = "u16"
desc = "Offset of first source payload byte, excluding any Pascal length prefix; [bp+6] after prologue."

[[params]]
name = "source_segment"
value = "[sp+6]"
type = "u16"
desc = "Segment of source payload pointer; [bp+8] after prologue."

[[params]]
name = "count"
value = "[sp+8]"
type = "u16"
desc = "Number of source bytes to append; [bp+0Ah] after prologue. Expected to fit destination capacity."

[[params]]
name = "destination_offset"
value = "[sp+0Ah]"
type = "u16"
desc = "Offset of destination Pascal string length byte; [bp+0Ch] after prologue."

[[params]]
name = "destination_segment"
value = "[sp+0Ch]"
type = "u16"
desc = "Segment of destination Pascal string; [bp+0Eh] after prologue."

[[params]]
name = "capacity"
value = "[sp+0Eh]"
type = "u16"
desc = "Maximum destination payload length, excluding length byte (normally <=255); [bp+10h] after prologue."

---
; Allocate four local bytes via shared stack-checking prologue; BP points to saved BP.
0d72:582a mov ax,4
@jmp checked_stack_frame_prologue@0d72:5c2a
0d72:582d call 5C2Ah
0d72:5830 push di
0d72:5831 push si
; Register runtime frame with argument 0Eh.
0d72:5832 mov ax,0Eh
0d72:5835 push ax
@jmp register_outermost_stack_frame@0d72:4fcc
0d72:5836 call far ptr 0D72h:4FCCh
; Load destination length byte and zero-extend it.
0d72:583b les di,[bp+0Ch]
@mem ; [es unknown]
0d72:583e mov al,es:[di]
0d72:5841 xor ah,ah
; Compute old_length + count (16-bit); signed JLE allows append when sum <= capacity.
@mem ; [ss unknown]
0d72:5843 add ax,[bp+0Ah]
@mem ; [ss unknown]
0d72:5846 cmp ax,[bp+10h]
@jmp 'append_payload@2
0d72:5849 jle short 5850h

; Capacity exceeded: fatal-error helper reports error 27h.
@jmp report_pascal_string_bounds_error@0d72:5ca6
0d72:584b call far ptr 0D72h:5CA6h

; Push source far pointer for copy_far_bytes_forward.
@label append_payload
0d72:5850 les di,[bp+6]
0d72:5853 push es
0d72:5854 push di
; Compute append destination = string pointer + old_length + 1, skipping length byte.
0d72:5855 les di,[bp+0Ch]
@mem ; [es unknown]
0d72:5858 mov al,es:[di]
0d72:585b xor ah,ah
0d72:585d xchg si,ax
0d72:585e inc si
0d72:585f add di,si
; Save computed append pointer in local far-pointer slot [bp-4].
@mem ; [ss unknown]
0d72:5861 mov [bp-4],di
@mem ; [ss unknown]
0d72:5864 mov [bp-2],es
; Push append destination and byte count, then copy source payload forward.
0d72:5867 push es
0d72:5868 push di
@mem ; [ss unknown]
0d72:5869 push word ptr [bp+0Ah]
@jmp copy_far_bytes_forward@0d72:507e
0d72:586c call far ptr 0D72h:507Eh
; Reload string pointer and length after copy; store low byte of length + count. No NUL terminator is written.
0d72:5871 les di,[bp+0Ch]
@mem ; [es unknown]
0d72:5874 mov al,es:[di]
0d72:5877 xor ah,ah
@mem ; [ss unknown]
0d72:5879 add ax,[bp+0Ah]
0d72:587c xor ah,ah
@mem ; [es unknown]
0d72:587e mov es:[di],al
; Unregister runtime frame and restore saved registers.
@jmp unregister_outermost_stack_frame@0d72:5004
0d72:5881 call far ptr 0D72h:5004h
0d72:5886 pop si
0d72:5887 pop di
0d72:5888 mov sp,bp
0d72:588a pop bp
; Far return, discarding all 12 argument bytes.
0d72:588b retf 0Ch

