function 0d72:01e1 (match_class_04_context)

Consumes one input byte when the current character has property bit
0x04.

Looks up the current character property flags in the table at CS:4A9C
using BX. If bit 0x04 is set, it decrements SI and increments the shared
context-match count at [BP+3]; otherwise it returns without changing
either value.

parameters:
  bx  char_table_index: u16 Zero-extended current character, used to index the character-property table at CS:4A9C.

parameters:
  si  input_cursor: *mut u8 Current near input pointer; decremented by one when the character matches class 0x04.

parameters:
  [bp+3]  match_count: u8 Shared caller-frame context-match count, incremented on a successful match.

---
; Test character-property bit 0x04 for the current byte.
@mem ; [bx unknown]
0d72:01e1 mov al,cs:[bx+4A9Ch]
0d72:01e6 and al,4
@jmp 'return_to_context_matcher@2
0d72:01e8 je short 01EEh

; Consume one matching byte and record one successful context match.
0d72:01ea dec si
@mem ; [ss unknown]
0d72:01eb inc byte ptr [bp+3]

@label return_to_context_matcher
0d72:01ee ret

