function 0d72:0190 (advance_input_cursor_by_scan_stride)

Advances the input cursor by one signed scan step and returns to the
rule matcher.

Adds the caller-frame scan stride at [BP+0Ch] to SI, so the same block
can move forward or backward through the input buffer. This address is
also the shared tail of the surrounding class-0x01 context matcher; it
assumes BP already refers to the active matcher stack frame.

parameters:
  si  input_cursor: *mut u8 Near pointer to the current input byte; updated in place by one scan step.

parameters:
  [bp+0Ch]  scan_stride: i16 Signed cursor increment, normally +1 for forward scanning or -1 for reverse scanning.

---
; Advance SI by one signed scan step from the caller stack frame.
@mem ; [ss unknown]
0d72:0190 add si,[bp+0Ch]
; Return to the encoded-rule context matcher.
0d72:0193 ret

