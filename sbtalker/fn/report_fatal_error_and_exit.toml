ip = "0d72:4bac"
name = "report_fatal_error_and_exit"
desc = "Print a fatal diagnostic with optional source and saved runtime context, then terminate the DOS process."
details = "Writes a leading two-byte separator, a fixed prefix and a DS-relative length-prefixed message, then a decimal diagnostic number and an optional nonzero hexadecimal detail; numeric fields are five characters wide. If DS:05F8h is nonzero, appends optional decimal DS:05FAh and two length-prefixed context names; if DS:0602h is nonzero, prints saved context words and the current DS in hexadecimal. Calls 0d72:656d, which passes DS:060Eh to runtime cleanup and DOS INT 21h/AH=4Ch termination (normally no return); exact literal strings, separator bytes and semantic meanings of individual context fields are not established by the available disassembly."
callers = ["0d72:5ca6"]
callees = ["0d72:656d", "0d72:673a", "register_outermost_stack_frame@0d72:4fcc", "unregister_outermost_stack_frame@0d72:5004", "write_stdout_near_buffer@0d72:4b0c", "write_stdout_u16_field@0d72:4b25"]

[[params]]
name = "detail"
value = "[sp+4]"
type = "u16"
desc = "Optional hexadecimal diagnostic detail; zero suppresses its prefix and field. Located at [bp+6]."

[[params]]
name = "diagnostic_number"
value = "[sp+6]"
type = "u16"
desc = "Always printed as an unsigned decimal five-character field; [bp+8]. Observed caller passes 0867h (2151)."

[[params]]
name = "message_offset"
value = "[sp+8]"
type = "u16"
desc = "Near pointer in DS to a byte-length-prefixed message: length at +0, text at +1; [bp+0Ah]."

[[params]]
name = "unused_argument"
value = "[sp+10]"
type = "u16"
desc = "Fourth argument word, not read; removed by RETF 8 in the nominal epilogue. Observed caller passes 0027h; possibly string capacity metadata, unconfirmed."

[[params]]
name = "data_segment"
value = "ds"
type = "u16"
desc = "Segment containing the message, literals, output-format globals and diagnostic context; also printed in the saved-context block."

