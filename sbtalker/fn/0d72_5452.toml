ip = "0d72:5452"
len = 48
name = "set_contains"
desc = "Tests whether an unsigned element belongs to an MSB-first packed bit set."
details = "Computes byte_index = element >> 3 and returns 0 if it exceeds the inclusive last-byte index. Otherwise returns 1 exactly when set[byte_index] & (0x80 >> (element & 7)) is nonzero; callers use this helper for character-set membership. The set is passed as a 16:16 far pointer, and RETF 8 removes the eight bytes of arguments."
blocks = ["0d72:5452", "0d72:5463", "0d72:547a", "0d72:547c"]

[[params]]
name = "set"
value = "[sp+4]"
type = "*const u8"
desc = "16:16 far pointer to packed set bytes (offset at entry SP+4, segment at SP+6; BP+6 after prologue)."

[[params]]
name = "last_byte_index"
value = "[sp+8]"
type = "u16"
desc = "Inclusive maximum valid byte index in the set (BP+0Ah after prologue), not a byte count."

[[params]]
name = "element"
value = "[sp+10]"
type = "u16"
desc = "Unsigned zero-based element number to test (BP+0Ch after prologue)."

[ret]
name = "present"
value = "ax"
type = "u16"
desc = "1 when the element's bit is set; 0 when clear or outside the supplied byte bound."

[annotations."0d72:5455"]
comment = "Compute unsigned byte index = element >> 3."
memory = "[ss unknown]"

[annotations."0d72:545e"]
comment = "Reject byte indices greater than the inclusive bound; equality is valid."
memory = "[ss unknown]"

[annotations."0d72:5461"]
jmp = "'not_present@2"

[annotations."0d72:5463"]
comment = "Load far set pointer and address set[byte_index]."

[annotations."0d72:5468"]
comment = "CL = (element & 7) + 1, selecting bits from most significant to least significant."
memory = "[ss unknown]"

[annotations."0d72:5470"]
comment = "Shift selected bit into carry: CF = (set[byte_index] >> (7 - (element & 7))) & 1."
memory = "[es unknown]"

[annotations."0d72:5475"]
comment = "Default AX to 1 without changing carry; keep it if selected bit was set."

[annotations."0d72:5478"]
jmp = "'return_result@3"

[annotations."0d72:547a"]
comment = "Out of range or bit clear: return 0."
label = "not_present"

[annotations."0d72:547c"]
label = "return_result"

[annotations."0d72:547f"]
comment = "Far return, callee discards 8 argument bytes."
