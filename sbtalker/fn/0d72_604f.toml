ip = "0d72:604f"
len = 143
name = "set_union_into_buffer"
desc = "Forms the union of two byte-backed sets in a 32-byte destination buffer."
details = "Clears all 32 destination bytes, copies bytes 0 through base_last_index from the base set, then ORs bytes 0 through or_last_index from the other set into the destination. Both lengths are inclusive last byte indices; the routine returns the destination's near offset in AX. Callers must provide a 32-byte destination and source ranges matching the supplied indices."
