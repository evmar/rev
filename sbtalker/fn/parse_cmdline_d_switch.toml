name = "parse_cmdline_d_switch"
desc = "Parses a command-line string to locate the '/D' switch and extracts up to an 8-character argument immediately following it into an internal buffer."
details = "Searches the string referenced by ES:DI for the forward slash ('/') character across CX bytes using REPNE SCASB. When found, it inspects the subsequent character to check if it matches 'D'. If matched, it reads up to 8 characters following '/D' until it encounters another '/' switch character or runs out of input characters, copying each character into a buffer located at CS:01AAh."
callers = ["parse_cmdline@0823:0be7"]
ip = "0823:0b87"

[[params]]
name = "cmdline_ptr"
value = "es:di"
type = "*const u8"
desc = "Pointer to the input string to scan"

[[params]]
name = "cmdline_len"
value = "cx"
type = "u16"
desc = "Length of the input string"

---
; Save registers and ensure forward string traversal
0823:0b87 push di
0823:0b88 push cx
0823:0b89 cld

; Scan for next '/' character
@label scan_for_slash
0823:0b8a mov al,2Fh
0823:0b8c repne scasb
; If end of string reached without finding switch, exit
@jmp 'exit@7
0823:0b8e jcxz 0BAFh

; Check if character immediately following '/' is 'D'
@mem ; [ds unknown]
0823:0b90 cmp byte ptr [di],44h
@jmp 'scan_for_slash@1
0823:0b93 jne short 0B8Ah

; Initialize destination buffer pointer and maximum argument length of 8 bytes
0823:0b95 mov bx,1AAh
0823:0b98 mov dx,8

; Check remaining string length
@label copy_loop
@jmp 'exit@7
0823:0b9b jcxz 0BAFh

; Read next character; stop if another '/' switch is encountered
0823:0b9d inc di
@mem ; [ds unknown]
0823:0b9e mov al,[di]
0823:0ba0 cmp al,2Fh
@jmp 'exit@7
0823:0ba2 je short 0BAFh

; Store character into CS:01AAh buffer and loop until 8 characters copied or CX is exhausted
@mem ; [bx unknown]
0823:0ba4 mov cs:[bx],al
0823:0ba7 inc bx
0823:0ba8 dec cx
0823:0ba9 dec dx
0823:0baa cmp dx,0
@jmp 'copy_loop@4
0823:0bad jne short 0B9Bh

; Restore registers and return
@label exit
0823:0baf pop cx
0823:0bb0 pop di
0823:0bb1 ret

