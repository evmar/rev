function 0d72:01e0 (immediate_return)

Returns immediately without changing registers, flags, or memory.

This one-instruction near-return entry point performs no work when
called directly. The same RET is also the successful exit of the
overlapping character-context routines at 0D72:01C7 and 0D72:01D0, but
entry at 0D72:01E0 has no observable effect beyond normal near-call
return-stack handling.

---
; No-op entry point; return immediately to the near caller.
0d72:01e0 ret

