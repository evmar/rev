function 0d72:656d (exit_with_saved_code)

Terminate the program with the default exit code stored in DS:060Eh.

Loads the exit code word from global DS:060Eh, pushes it onto the stack,
and calls far function 0d72:6e28 to perform runtime teardown,
flush/close open file handles, restore interrupt vectors, and exit via
DOS INT 21h/AH=4Ch. Does not normally return.

parameters:
  ds  data_segment: u16 Segment containing runtime state and the exit code at offset 060Eh

---
0d72:656d push bp
0d72:656e mov bp,sp
; Pass default program exit code stored at DS:060Eh
@mem ; [ds unknown]
0d72:6570 push word ptr ds:[60Eh]
; Call exit/cleanup runtime handler (0d72:6e28)
@jmp 0d72:6e28
0d72:6574 call far ptr 0D72h:6E28h
0d72:6579 mov sp,bp
0d72:657b pop bp
0d72:657c retf

