ip = "0d72:0157"
name = "tail_dispatch_pronunciation_context_handler"
desc = "Tail-dispatches to the selected pronunciation-context matcher."
details = "AX contains the near code offset loaded from the context-operator handler table by dispatch_pronunciation_context_operator. The indirect jump preserves BL and the remaining shared matcher state and transfers control without adding a return address, so the selected handler returns directly to the dispatcher's caller."
callees = ["unknown:reg"]

[[params]]
name = "handler_offset"
value = "ax"
type = "u16"
desc = "Near code-segment offset of the selected context-matcher handler."

[[params]]
name = "current_input_byte"
value = "bl"
type = "u8"
desc = "Current input byte passed to the selected handler."

---
; Tail-jump to the context matcher selected from the operator dispatch table; the handler returns directly to the original caller.
@jmp unknown:reg
0d72:0157 jmp ax

