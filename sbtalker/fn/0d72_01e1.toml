ip = "0d72:01e1"
len = 14
name = "match_class_04_context"
desc = "Consumes one input byte when the current character has property bit 0x04."
details = "Looks up the current character property flags in the table at CS:4A9C using BX. If bit 0x04 is set, it decrements SI and increments the shared context-match count at [BP+3]; otherwise it returns without changing either value."
blocks = ["0d72:01e1", "0d72:01ea", "0d72:01ee"]

[[params]]
name = "char_table_index"
value = "bx"
type = "u16"
desc = "Zero-extended current character, used to index the character-property table at CS:4A9C."

[[params]]
name = "input_cursor"
value = "si"
type = "*mut u8"
desc = "Current near input pointer; decremented by one when the character matches class 0x04."

[[params]]
name = "match_count"
value = "[bp+3]"
type = "u8"
desc = "Shared caller-frame context-match count, incremented on a successful match."

[annotations."0d72:01e1"]
