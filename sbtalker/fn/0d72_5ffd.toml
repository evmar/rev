ip = "0d72:5ffd"
len = 3431
name = "checked_stack_frame_prologue_copy"
desc = "Establish a BP frame and reserve AX local bytes after checking the runtime stack limit."
details = "Called with a near CALL, this helper removes the continuation IP into CX, saves the old BP, sets BP to the saved word, and computes candidate SP = BP - AX. It rejects unsigned wraparound or a candidate below DS:[0792h]; otherwise it commits SP and jumps to the continuation. On failure it passes a far continuation to the shared allocator at 0d72:6b88, which retries the check and either resumes the caller, invokes the installed overflow handler at DS:[078Eh], or prints diagnostic code 0 and terminates through DS:[0798h]."
blocks = ["0d72:5ffd", "0d72:6007", "0d72:600d", "0d72:6011", "0d72:6b88", "0d72:6b90", "0d72:6b96", "0d72:6b9b", "0d72:6ba1", "0d72:6ba6", "0d72:6d29", "0d72:6d47", "0d72:6d4c", "0d72:6d51", "0d72:6d62"]

