ip = "0d72:53b0"
name = "copy_words_to_stack"
desc = "Allocates stack space and copies CX words from ES:BX onto the caller's stack."
details = "Removes the far return address into DS:05F2/05F4, computes a 2*CX-byte allocation below the caller's SP, and calls 0d72:6b88 if subtraction borrows or the resulting offset is below the stack limit at DS:0792. It sets SP to the destination, copies words forward from ES:BX through DS:DI (requiring DS to address the stack, normally DS=SS), and far-jumps to the saved return address, leaving the copied block at SS:SP; the known caller supplies CX=0x11 to copy 34 bytes. The normal path consumes CX to zero, advances BX by 2*CX and DI to the pre-allocation caller SP, and leaves AX holding the last word; the unchecked count must be nonzero and small enough that doubling does not wrap, and the global return-address scratch makes this helper non-reentrant."
callers = ["parse_and_emit_token@0935:12fc"]
callees = ["0d72:6b88", "unknown:mem"]

[[params]]
name = "source"
value = "es:bx"
type = "*const u16"
desc = "Far pointer to the source words; BX advances by the copied byte count."

[[params]]
name = "word_count"
value = "cx"
type = "u16"
desc = "Number of words to copy; must be nonzero and fit a non-wrapping doubled byte count. Consumed to zero."

---
; Pop the far return IP and CS into global scratch DS:05F2/05F4, exposing the caller's SP.
@mem ; [ds unknown]
0d72:53b0 pop word ptr ds:[5F2h]
@mem ; [ds unknown]
0d72:53b4 pop word ptr ds:[5F4h]
; AX = 2*word_count; DI = caller_SP - AX. The following JB detects subtraction underflow, not overflow of the doubling.
0d72:53b8 mov ax,cx
0d72:53ba shl ax,1
0d72:53bc mov di,sp
0d72:53be sub di,ax
@jmp 'handle_stack_limit@2
0d72:53c0 jb short 53C8h

; Accept destination offsets at or above the stack lower bound DS:0792.
@mem ; [ds unknown]
0d72:53c2 cmp di,ds:[792h]
@jmp 'allocate_destination@3
0d72:53c6 jae short 53E6h

; Save source pointer and count in global scratch DS:05EC/05EE/05E8 before invoking the checked stack-allocation/overflow helper.
@label handle_stack_limit
@mem ; [ds unknown]
0d72:53c8 mov ds:[5ECh],bx
@mem ; [ds unknown]
0d72:53cc mov ds:[5EEh],cx
@mem ; [ds unknown]
0d72:53d0 mov ds:[5E8h],es
@jmp 0d72:6b88
0d72:53d4 call far ptr 0D72h:6B88h
0d72:53d9 nop
; Restore BX, CX and ES if the stack helper returns.
@mem ; [ds unknown]
0d72:53da mov bx,ds:[5ECh]
@mem ; [ds unknown]
0d72:53de mov cx,ds:[5EEh]
@mem ; [ds unknown]
0d72:53e2 mov es,ds:[5E8h]

; Reserve the block by installing its starting offset as SP.
@label allocate_destination
0d72:53e6 mov sp,di

; Copy one word from ES:BX to DS:DI and advance both offsets by two; destination assumes DS aliases SS. No zero-count guard precedes LOOP.
@label copy_word_loop
@mem ; [es unknown]
0d72:53e8 mov ax,es:[bx]
0d72:53eb inc bx
0d72:53ec inc bx
@mem ; [ds unknown]
0d72:53ed mov [di],ax
0d72:53ef inc di
0d72:53f0 inc di
@jmp 'copy_word_loop@4
0d72:53f1 loop 53E8h

; Far jump to saved CS:IP instead of RETF, so the copied block remains at the top of the caller's stack.
@jmp unknown:mem
@mem ; [ds unknown]
0d72:53f3 jmp dword ptr ds:[5F2h]

