function 0d72:604f (set_union_into_buffer)

Forms the union of two byte-backed sets in a 32-byte destination buffer.

Clears all 32 destination bytes, copies bytes 0 through base_last_index
from the base set, then ORs bytes 0 through or_last_index from the other
set into the destination. Both lengths are inclusive last byte indices;
the routine returns the destination's near offset in AX. Callers must
provide a 32-byte destination and source ranges matching the supplied
indices.

parameters:
  [bp+6]  dest: *mut u8 Near pointer to the 32-byte destination set in DS.

parameters:
  [bp+8]  or_set: *const u8 Far pointer to the set whose bytes are ORed into the destination.

parameters:
  [bp+0Ch]  or_last_index: u16 Inclusive last byte index to read from or_set.

parameters:
  [bp+0Eh]  base_set: *const u8 Far pointer to the set copied into the destination first.

parameters:
  [bp+12h]  base_last_index: u16 Inclusive last byte index to read from base_set.

return:
  ax  dest: *mut u8 Near pointer to the destination set in DS.

