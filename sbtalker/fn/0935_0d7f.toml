name = "apply_prosody_intonation"
desc = "Calculates prosodic pitch contours and processes stress markers in a text-to-speech input string"
details = '''Parses words and trailing punctuation in a Pascal string to compute baseline intonation and pitch contours for vowels according to punctuation rules (periods, question marks, exclamations, semicolons, and WH-questions). It also interprets manual pitch and stress control characters ('#', '@', '/', '\'), updating pitch levels and removing the control characters from the string using System.Delete.'''
