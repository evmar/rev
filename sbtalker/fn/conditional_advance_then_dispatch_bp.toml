ip = "0d72:01a0"
name = "conditional_advance_then_dispatch_bp"
desc = "Conditionally advances SI and a BP-relative byte counter, then transfers control to the near address held in BP."
details = "This is a continuation-style trampoline rather than a conventional callee: PUSH BP followed by the shared RET makes execution continue at CS:BP while leaving the original return address on the stack. If the incoming ZF is clear it dispatches immediately with CF set; if ZF is set it adds [SS:BP+0x0c] to SI twice and increments byte [SS:BP+3], with the final ADD determining the outgoing arithmetic flags."

[[params]]
name = "continuation_and_state_base"
value = "bp"
type = "u16"
desc = "Near continuation address for the RET-based dispatch and SS-relative base of the state fields."

[[params]]
name = "cursor"
value = "si"
type = "u16"
desc = "Cursor advanced twice by the BP-relative stride when incoming ZF is set."

[[params]]
name = "condition"
value = "flags.ZF"
type = "u8"
desc = "Incoming zero flag; clear selects immediate dispatch, set selects the state-update path."

[[params]]
name = "stride"
value = "[bp+0x0c]"
type = "u16"
desc = "SS-relative increment added to SI twice on the update path."

[[params]]
name = "counter"
value = "[bp+3]"
type = "u8"
desc = "SS-relative byte counter incremented once on the update path."

---
0d72:018d inc byte ptr [bp+3]
0d72:0190 add si,[bp+0Ch]

0d72:0193 ret

; Set CF for the immediate-dispatch path; the update path later replaces arithmetic flags.
0d72:01a0 stc
; Push BP as a synthetic return address, so the shared RET dispatches to CS:BP.
0d72:01a1 push bp
; If incoming ZF is clear, skip updates and dispatch through BP.
@jmp '1
0d72:01a2 jne short 0193h

; ZF-set path: advance SI once, then reuse the preceding shared tail to increment the counter, advance SI again, and RET to BP.
0d72:01a4 add si,[bp+0Ch]
@jmp '0
0d72:01a7 jmp short 018Dh

