[package]
name = "rev"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
axum-vite = "0.3.4"
ts-rs = "12"
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3.34"
openrouter-rs = "0.14.0"
tokio = { version = "1", features = ["full"] }
iced-x86 = "1.21.0"

exe = { path = "../theseus/exe" }
runtime = { path = "../theseus/runtime", features = ["serde"] }
indoc = "2.0.7"
argh = "0.1.19"
toml = "1.1.4"
serde = "1.0.229"
anyhow = "1.0.104"
serde_json = "1.0.151"
serde_with = "3.22.0"
