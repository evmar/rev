ip = "0d72:0160"
name = "match_repeatable_class_10_context_after_test"
desc = "Continues the repeatable class-0x10 context matcher after testing the current input byte."
details = "Entry ZF is the result of ANDing the current byte's character-property value with 0x10 at 0d72:015e; a zero result rejects the current byte. On a match, this block increments the shared match count, advances SI by the signed scan stride, and checks whether the adjacent byte is also class 0x10. If repetition is permitted by property bit 0x01 on the next encoded rule token, it returns to the shared dispatcher; otherwise it saves DI as the context backtracking marker."
callees = ["unknown:reg"]

[[params]]
name = "current_class_match"
value = "flags.ZF"
type = "u8"
desc = "ZF from the preceding class-bit-0x10 test; clear means the current byte matched."

[[params]]
name = "input_cursor"
value = "si"
type = "*mut u8"
desc = "Near pointer to the current input byte; advanced by scan_stride after a match."

[[params]]
name = "rule_cursor"
value = "di"
type = "*const u8"
desc = "Near code-segment pointer to the active encoded context token; may be saved as the backtracking marker."

[[params]]
name = "adjacent_byte"
value = "ch"
type = "u8"
desc = "Input byte one scan_stride beyond the current byte."

[[params]]
name = "scan_stride"
value = "[bp+0Ch]"
type = "i16"
desc = "Signed input direction, normally -1 for left context or +1 for right context."

---
@label redispatch_context_operator
@mem ; [ds unknown]
0d72:0140 mov cl,[si]
@mem ; [ss unknown]
0d72:0142 mov bx,[bp+0Ch]
@mem ; [ds unknown]
0d72:0145 mov ch,[bx+si]
@mem ; [ss unknown]
0d72:0147 mov al,[bp+1]
0d72:014a shl al,1
0d72:014c mov bl,al
0d72:014e xor bh,bh
@mem ; [bx unknown]
0d72:0150 mov ax,cs:[bx+2EAh]
0d72:0155 mov bl,cl
@jmp unknown:reg
0d72:0157 jmp ax

; Reject if the preceding current-byte property test did not contain class bit 0x10.
@jmp 'return_to_rule_matcher@5
0d72:0160 je short 0183h

; Count this match and advance the input cursor in the active scan direction.
@mem ; [ss unknown]
0d72:0162 inc byte ptr [bp+3]
@mem ; [ss unknown]
0d72:0165 add si,[bp+0Ch]
; Stop unless the adjacent input byte also has character-property bit 0x10.
0d72:0168 mov bl,ch
@mem ; [bx unknown]
0d72:016a mov al,cs:[bx+4A9Ch]
0d72:016f and al,10h
@jmp 'return_to_rule_matcher@5
0d72:0171 je short 0183h

; Test whether the next encoded rule token permits repeating this context operator.
@mem ; [di unknown]
0d72:0173 mov bl,cs:[di+1]
@mem ; [bx unknown]
0d72:0177 mov al,cs:[bx+4A3Ch]
0d72:017c and al,1
; Redispatch to greedily consume another class member when repetition is permitted.
@jmp 'redispatch_context_operator@0
0d72:017e jne short 0140h

; Save the rule cursor as the caller's context backtracking marker.
@mem ; [ss unknown]
0d72:0180 mov [bp+0Eh],di

@label return_to_rule_matcher
0d72:0183 ret

