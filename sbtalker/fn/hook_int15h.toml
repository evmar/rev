ip = "0823:084d"
name = "hook_int15h"
desc = "Hooks interrupt 15h (BIOS System Services)"
details = "Disables interrupts to safely hook INT 15h (vector at 0000:0054h). It saves the existing ISR vector to CS:[0086h] and CS:[0088h], then overwrites the interrupt vector table with the address of a new handler at 0823:07FCh."
callers = ["tsr_entry_point@0823:0ae2"]

---
0823:084d cli
0823:084e push es
0823:084f push di
0823:0850 push ax
; Point ES to the Interrupt Vector Table (segment 0000h)
0823:0851 sub ax,ax
0823:0853 mov es,ax
; Vector offset for INT 15h (21 * 4 = 54h)
0823:0855 mov di,54h
; Save original INT 15h offset to CS:[0086h]
@mem ; [es unknown]
0823:0858 mov ax,es:[di]
@mem 0823:0086
0823:085b mov cs:[86h],ax
; Save original INT 15h segment to CS:[0088h]
@mem ; [es unknown]
0823:085f mov ax,es:[di+2]
@mem 0823:0088
0823:0863 mov cs:[88h],ax
; Install new INT 15h handler at 0823:07FCh
0823:0867 mov ax,7FCh
@mem ; [es unknown]
0823:086a mov es:[di],ax
0823:086d mov ax,823h
@mem ; [es unknown]
0823:0870 mov es:[di+2],ax
0823:0874 pop ax
0823:0875 pop di
0823:0876 pop es
0823:0877 sti
0823:0878 ret

