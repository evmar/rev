name = "read_filtered_token"
desc = "Reads characters into a buffer while they belong to an allowed character set"
details = "Initializes the output buffer and loops reading characters until a maximum length of 120 (0x78) is reached or an input character does not belong to the permitted character set passed at [bp+6]. It also checks characters against a secondary character set to set a global flag at ds:[0054h] and updates an editor/UI state via an internal callback."
