ip = "0823:0804"
len = 42
name = "reset_int9_to_bios"
desc = "Hooks or resets interrupt vector 09h (keyboard ISR) to the ROM BIOS default handler"
details = "Saves the current interrupt 09h vector (located at 0000:0024h) into code-segment storage at cs:[0082h] and cs:[0084h]. It then updates the vector to point directly to the standard IBM PC ROM BIOS keyboard interrupt service routine at F000:E987h."
callers = ["tsr_entry_point@0823:0ae2"]

---
0823:0804 cli
0823:0805 push es
0823:0806 push di
0823:0807 push ax
0823:0808 sub ax,ax
; Point ES to the Interrupt Vector Table at 0000:0000h
0823:080a mov es,ax
; Vector for INT 09h (09h * 4 = 24h)
0823:080c mov di,24h
@mem ; [es unknown]
0823:080f mov ax,es:[di]
; Save existing INT 09h offset
@mem 0823:0082
0823:0812 mov cs:[82h],ax
@mem ; [es unknown]
0823:0816 mov ax,es:[di+2]
; Save existing INT 09h segment
@mem 0823:0084
0823:081a mov cs:[84h],ax
; Set INT 09h vector to default BIOS keyboard ISR (F000:E987h)
@mem ; [es unknown]
0823:081e mov word ptr es:[di],0E987h
@mem ; [es unknown]
0823:0823 mov word ptr es:[di+2],0F000h
0823:0829 pop ax
0823:082a pop di
0823:082b pop es
0823:082c sti
0823:082d ret

