name = "parse_cmdline_p_switch"
desc = "Searches an input string for the switch '/P' followed by a 4-digit hexadecimal value and stores the result."
details = "Scans the input buffer pointed to by ES:DI for the switch '/P'. If located, it parses the next 4 hexadecimal digits into a 16-bit word using an external digit parser and stores the result at CS:[01B2h]. If the switch is not found or an invalid hex digit is encountered, 0 is stored instead."
callers = ["parse_cmdline@0823:0be7"]
callees = ["parse_hex_digit@0823:0b6a"]
ip = "0823:0bb2"

[[params]]
name = "cmdline"
value = "es:di"
type = "char*"
desc = "Pointer to the command line buffer to scan"

[[params]]
name = "len"
value = "cx"
type = "u16"
desc = "Length of the command line buffer in bytes"

[ret]
name = "value"
value = "bx"
type = "u16"
desc = "Parsed 16-bit hexadecimal value (also written to CS:[01B2h]), or 0 on failure"

---
; Save registers, clear direction flag, and initialize result to 0
0823:0bb2 push di
0823:0bb3 push cx
0823:0bb4 xor bx,bx
0823:0bb6 cld

; Scan input string for '/' character; exit if end of buffer is reached
@label scan_slash
0823:0bb7 mov al,2Fh
0823:0bb9 repne scasb
@jmp 'done@7
0823:0bbb jcxz 0BDFh

; Check if character following '/' is 'P'; continue scanning if not
@mem ; [ds unknown]
0823:0bbd cmp byte ptr [di],50h
@jmp 'scan_slash@1
0823:0bc0 jne short 0BB7h

; Skip 'P' and set up loop counter to parse 4 hexadecimal digits
0823:0bc2 inc di
0823:0bc3 xor bx,bx
0823:0bc5 mov dx,4
0823:0bc8 mov cx,4

; Fetch next character and convert hex ASCII to numeric value; abort on error
@label parse_digit_loop
@mem ; [ds unknown]
0823:0bcb mov al,[di]
0823:0bcd inc di
@jmp parse_hex_digit@0823:0b6a
0823:0bce call 0B6Ah
0823:0bd1 cmp ah,0
@jmp 'done@7
0823:0bd4 jne short 0BDFh

; Shift current 16-bit value left by 4 bits and accumulate new nibble
0823:0bd6 shl bx,cl
0823:0bd8 add bx,ax
0823:0bda dec dx
@jmp 'parse_digit_loop@4
0823:0bdb jne short 0BCBh

@jmp 'done@7
0823:0bdd jmp short 0BDFh

; Store the parsed 16-bit result into CS:[01B2h], restore registers, and return
@label done
@mem 0823:01b2
0823:0bdf mov cs:[1B2h],bx
0823:0be4 pop cx
0823:0be5 pop di
0823:0be6 ret

