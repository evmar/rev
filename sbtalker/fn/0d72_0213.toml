[annotations."0d72:0207"]
jmp = "'return_to_caller@2"

[annotations."0d72:0209"]
comment = "Save DI in the caller's state when the character-table flag is set."
memory = "[ss unknown]"

[annotations."0d72:020c"]
label = "return_to_caller"

[annotations."0d72:0213"]
comment = "Require CH == 'Q'; otherwise return without updating scan state."

[annotations."0d72:0216"]
jmp = "'return_to_caller@2"

[annotations."0d72:0218"]
comment = "Require CL == 'U' to recognize the QU pair."

[annotations."0d72:021b"]
