ip = "0d72:01d0"
len = 31
name = "match_h_digraph_after_c_test"
desc = "Completes the C/S/T prefix test for an H digraph and consumes the two-byte unit on success."
details = "This is an overlapping tail fragment of match_class_04_context_with_h_digraph, entered immediately after CMP AL, 0x43 with AL holding the byte adjacent to H. It accepts C from the incoming ZF state or explicitly tests for S and T; a match subtracts two from SI and increments the shared context-match count at [BP+3], while failure returns without changing either value."

[[params]]
name = "adjacent_char"
value = "al"
type = "u8"
desc = "Byte adjacent to the current H, already compared with ASCII C by the parent routine."

[[params]]
name = "input_cursor"
value = "si"
type = "*mut u8"
desc = "Current near input pointer, decremented by two when the adjacent byte is C, S, or T."

[[params]]
name = "match_count"
value = "[bp+3]"
type = "u8"
desc = "Shared caller-frame context-match count, incremented on a successful digraph match."

[[params]]
name = "c_compare_equal"
value = "ZF"
type = "u8"
desc = "Incoming zero flag from CMP AL, 0x43; set when adjacent_char is ASCII C."

---
@jmp '3
0d72:01d0 je short 01DAh

0d72:01d2 cmp al,53h
@jmp '3
0d72:01d4 je short 01DAh

0d72:01d6 cmp al,54h
@jmp '4
0d72:01d8 jne short 01EEh

0d72:01da sub si,2
@mem ; [ss unknown]
0d72:01dd inc byte ptr [bp+3]
0d72:01e0 ret

0d72:01ee ret

