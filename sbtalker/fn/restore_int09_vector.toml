ip = "0823:082e"
name = "restore_int09_vector"
desc = "restores the INT 09h (keyboard) interrupt vector"
details = "Disables interrupts and updates the interrupt vector table entry for INT 09h (at 0000:0024h) using the offset and segment values stored in the code segment at cs:[0082h] and cs:[0084h]. Re-enables interrupts and restores modified registers before returning."
callers = ["tsr_entry_point@0823:0ae2"]

---
0823:082e cli
0823:082f push es
0823:0830 push di
0823:0831 push ax
0823:0832 sub ax,ax
; Point ES to interrupt vector table (segment 0)
0823:0834 mov es,ax
; Offset 0x24 corresponds to INT 09h vector (0x09 * 4)
0823:0836 mov di,24h
; Restore INT 09h offset from cs:[0082h]
@mem 0823:0082
0823:0839 mov ax,cs:[82h]
@mem ; [es unknown]
0823:083d mov es:[di],ax
; Restore INT 09h segment from cs:[0084h]
@mem 0823:0084
0823:0840 mov ax,cs:[84h]
@mem ; [es unknown]
0823:0844 mov es:[di+2],ax
0823:0848 pop ax
0823:0849 pop di
0823:084a pop es
0823:084b sti
0823:084c ret

