name = "entry_point"
desc = "TSR installer and program entry point"
details = "Initializes registers, frees the program's DOS environment block, and queries INT 2Fh (AX=FBFBh) to determine whether the TSR is already installed. If already resident, it terminates via INT 21h AH=4Ch with exit code 0FBh; otherwise, it records MCB allocation details, executes configuration and hardware setup routines, hooks INT 2Fh to its resident handler, and terminates via INT 21h AH=31h to stay resident."
callees = ["backup_ivt@0823:09e5", "dispatch_command@0823:0f5b", "ems_init@0823:0aa0", "init_callback_ptr@0823:0b3c", "init_heap_bounds@0823:0943", "load_driver@0823:0c86", "parse_cmdline@0823:0be7", "print_string_with_suffix@0823:0c79"]
ip = "0823:0cec"

---
; Initialize segment registers and clear general registers
0823:0cec mov ax,cs
0823:0cee sub ax,10h
0823:0cf1 mov ds,ax
0823:0cf3 mov es,ax
0823:0cf5 sub ax,ax
0823:0cf7 sub bx,bx
0823:0cf9 sub cx,cx
0823:0cfb sub dx,dx
0823:0cfd sub si,si
0823:0cff sub di,di
0823:0d01 push ax
0823:0d02 pop bp
; Get current PSP and free environment memory block
0823:0d03 mov ah,51h
0823:0d05 int 21h
0823:0d07 mov es,bx
0823:0d09 mov ax,es:[2Ch]
0823:0d0d mov es,ax
0823:0d0f mov ah,49h
0823:0d11 int 21h
; Check if INT 2Fh is present and test if TSR is already resident via multiplex AX=FBFBh
0823:0d13 mov ax,352Fh
0823:0d16 int 21h
0823:0d18 mov ax,es
0823:0d1a cmp ax,0
@label install
@jmp 'setup_memory@2
0823:0d1d je short 0D28h

0823:0d1f mov ax,0FBFBh
0823:0d22 int 2Fh
0823:0d24 or ax,ax
; Already installed; jump to exit
@jmp 'exit_already_installed@3
0823:0d26 je short 0D88h

; Inspect MCB to record block size and calculate next block segment
@label setup_memory
0823:0d28 mov bx,cs
0823:0d2a sub bx,10h
@mem 0823:008e
0823:0d2d mov cs:[8Eh],bx
0823:0d32 dec bx
0823:0d33 mov ds,bx
0823:0d35 mov si,3
0823:0d38 mov dx,[si]
@mem 0823:0090
0823:0d3a mov cs:[90h],dx
0823:0d3f inc bx
0823:0d40 add bx,dx
@mem 0823:00a9
0823:0d42 mov cs:[0A9h],bx
; Call initialization routines (IVT backup, command-line parsing, driver setup, etc.)
0823:0d47 mov al,1
@jmp backup_ivt@0823:09e5
0823:0d49 call 09E5h
@jmp parse_cmdline@0823:0be7
0823:0d4c call 0BE7h
@jmp load_driver@0823:0c86
0823:0d4f call 0C86h
@jmp dispatch_command@0823:0f5b
0823:0d52 call 0F5Bh
@jmp init_heap_bounds@0823:0943
0823:0d55 call 0943h
@jmp init_callback_ptr@0823:0b3c
0823:0d58 call 0B3Ch
@jmp ems_init@0823:0aa0
0823:0d5b call 0AA0h
; Hook INT 2Fh to internal handler at CS:0898h, saving the old vector
0823:0d5e mov ax,352Fh
0823:0d61 int 21h
@mem 0823:007e
0823:0d63 mov cs:[7Eh],es
@mem 0823:0080
0823:0d68 mov cs:[80h],bx
0823:0d6d push cs
0823:0d6e pop ds
0823:0d6f mov dx,898h
0823:0d72 mov ax,252Fh
0823:0d75 int 21h
; Prepare resident size and invoke DOS TSR (INT 21h, AH=31h)
0823:0d77 lea dx,ds:[0ABh]
@jmp print_string_with_suffix@0823:0c79
0823:0d7b call 0C79h
0823:0d7e mov ax,3100h
@mem 0823:0090
0823:0d81 mov dx,cs:[90h]
0823:0d86 int 21h

; Exit program with error code 0FBh when TSR is already loaded
@label exit_already_installed
0823:0d88 mov ah,4Ch
0823:0d8a mov al,0FBh
0823:0d8c int 21h

