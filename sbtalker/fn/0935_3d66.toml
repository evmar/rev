name = "process_transaction_loop"
desc = "Initializes and executes an event/transaction processing loop, then finalizes state and returns an adjusted identifier."
details = "Updates an 8-byte state table record indexed by ds:[166h] with configuration bytes, sets up a 256-byte buffer via far call, and enters a polling loop (calling subroutines to service tasks until ds:[4Ch] remains 3 or ds:[60h] becomes nonzero). Finally, it runs a completion callback passing the far buffer pointer and returns ds:[160h] decremented by 2."
