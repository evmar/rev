ip = "0823:0879"
name = "restore_int15_handler"
desc = "restores or sets the INT 15h interrupt vector"
details = "Disables interrupts and updates the Interrupt Vector Table entry for INT 15h (at 0000:0054h) using the far pointer stored at cs:[0086h]. Interrupts are re-enabled before returning."
callers = ["tsr_entry_point@0823:0ae2"]

---
; disable interrupts during IVT update
0823:0879 cli
0823:087a push es
0823:087b push di
0823:087c push ax
0823:087d sub ax,ax
; ES = 0000h (Interrupt Vector Table segment)
0823:087f mov es,ax
; vector offset for INT 15h (15h * 4 = 54h)
0823:0881 mov di,54h
@mem 0823:0086
0823:0884 mov ax,cs:[86h]
; write INT 15h offset
@mem ; [es unknown]
0823:0888 mov es:[di],ax
@mem 0823:0088
0823:088b mov ax,cs:[88h]
; write INT 15h segment
@mem ; [es unknown]
0823:088f mov es:[di+2],ax
0823:0893 pop ax
0823:0894 pop di
0823:0895 pop es
0823:0896 sti
0823:0897 ret

