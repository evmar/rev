name = "parse_cmdline_switch_d"
desc = "Parses a command-line string to locate the '/D' switch and extracts up to an 8-character argument immediately following it into an internal buffer in the code segment."
ip = "0823:0b87"

---
; Save registers and ensure forward string traversal
0823:0b87 push di
0823:0b88 push cx
0823:0b89 cld

; Scan string for the forward slash ('/') switch character
0823:0b8a mov al,2Fh
0823:0b8c repne scasb
@jmp '7
0823:0b8e jcxz 0BAFh

; Verify if the character following '/' is 'D'; if not, continue searching
0823:0b90 cmp byte ptr [di],44h
@jmp '1
0823:0b93 jne short 0B8Ah

; Initialize destination buffer (CS:01AAh) and set maximum length to 8 characters
0823:0b95 mov bx,1AAh
0823:0b98 mov dx,8
@jmp '7
0823:0b9b jcxz 0BAFh

@jmp '7
0823:0b9b jcxz 0BAFh

; Copy parameter characters until reaching end of string, another '/', or 8 characters
0823:0b9d inc di
0823:0b9e mov al,[di]
0823:0ba0 cmp al,2Fh
@jmp '7
0823:0ba2 je short 0BAFh

0823:0ba4 mov cs:[bx],al
0823:0ba7 inc bx
0823:0ba8 dec cx
0823:0ba9 dec dx
0823:0baa cmp dx,0
@jmp '4
0823:0bad jne short 0B9Bh

; Restore registers and return
0823:0baf pop cx
0823:0bb0 pop di
0823:0bb1 ret

